<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Modul Interaktif</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 { text-align: center; }

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 10px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #5a67d8;
}

.result {
    margin-top: 15px;
    padding: 10px;
    background: #f4f4f4;
    border-radius: 6px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Modul Interaktif</h2>

    <input type="text" id="nama" placeholder="Nama kamu">
    <input type="text" id="hobi" placeholder="Hobi kamu">
    <input type="text" id="cita" placeholder="Cita-cita">
    <input type="text" id="mood" placeholder="Mood hari ini">

    <button onclick="tampilkan()">Tampilkan</button>

    <div class="result" id="output"></div>
</div>

<script>
function tampilkan() {
    let nama = document.getElementById("nama").value;
    let hobi = document.getElementById("hobi").value;
    let cita = document.getElementById("cita").value;
    let mood = document.getElementById("mood").value;

    if(nama === "" || hobi === "" || cita === "" || mood === "") {
        alert("Isi semua data!");
        return;
    }

    let hasil = `
        <h3>Halo, ${nama} 👋</h3>
        <p><b>Hobi:</b> ${hobi}</p>
        <p><b>Cita-cita:</b> ${cita}</p>
        <p><b>Mood hari ini:</b> ${mood}</p>
        <hr>
        <b>Terus semangat ya! 💪</b>
    `;

    document.getElementById("output").innerHTML = hasil;
}
</script>

</body>
</html>
